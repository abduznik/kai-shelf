name: Build (reusable)

on:
  workflow_call:
    inputs:
      build_mode:
        description: "Flutter build mode (debug or release)"
        type: string
        default: release

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --${{ inputs.build_mode }}

      - name: Rename APK
        shell: bash
        run: mv build/app/outputs/flutter-apk/app-${{ inputs.build_mode }}.apk build/app/outputs/flutter-apk/kai-shelf-${{ steps.version.outputs.version }}-${{ inputs.build_mode }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kai-shelf-android-${{ inputs.build_mode }}
          path: build/app/outputs/flutter-apk/kai-shelf-${{ steps.version.outputs.version }}-${{ inputs.build_mode }}.apk

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Windows
        run: flutter build windows --${{ inputs.build_mode }}

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/${{ inputs.build_mode == 'debug' && 'Debug' || 'Release' }}/*" -DestinationPath "kai-shelf-${{ steps.version.outputs.version }}-windows-${{ inputs.build_mode }}.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: kai-shelf-windows-${{ inputs.build_mode }}
          path: kai-shelf-${{ steps.version.outputs.version }}-windows-${{ inputs.build_mode }}.zip

  build-web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: flutter build web --${{ inputs.build_mode }}

      - name: Zip build output
        run: (cd build/web && zip -r ../../kai-shelf-${{ steps.version.outputs.version }}-web-${{ inputs.build_mode }}.zip .)

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: kai-shelf-web-${{ inputs.build_mode }}
          path: kai-shelf-${{ steps.version.outputs.version }}-web-${{ inputs.build_mode }}.zip
